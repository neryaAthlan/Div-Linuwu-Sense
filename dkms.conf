# DKMS configuration for the Linuwu Sense module.
#
# The source tree is built out-of-tree against each installed kernel's headers,
# so a kernel upgrade rebuilds and installs the module automatically.
# DKMS installs it under /lib/modules/<kernel>/updates/dkms, which takes
# priority over the in-tree acer_wmi driver.
PACKAGE_NAME="linuwu_sense"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src"
# Required by DKMS; modern versions install into /lib/modules/<kernel>/updates/dkms.
DEST_MODULE_LOCATION[0]="/updates"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
MAKE[1]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
